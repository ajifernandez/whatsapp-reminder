# Stack para Dockge. Los informes quedan en ./data (o un dataset de TrueNAS).
# Exponerlo con tu proxy inverso / tunel (HTTPS) hacia el puerto 3000 de este contenedor.
services:
  soporte:
    build: .
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      # NTFY_URL: https://ntfy.tudominio/diagnosticos   # opcional: aviso push
      DATA_DIR: /data
      ADMIN_USER: admin
      ADMIN_PASS: cambia-esto   # contraseña de la interfaz web (GET /); sin ella queda desactivada
    volumes:
      - ./data:/data
