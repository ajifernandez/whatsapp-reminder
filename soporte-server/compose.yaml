# Pegar en Dockge (nuevo stack "soporte"). No hace falta copiar ficheros ni construir:
# al arrancar descarga server.js desde GitHub (rama main).
# Despues, publicarlo con HTTPS (Nginx Proxy Manager) hacia el puerto 3100 de este host.
services:
  soporte:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "wget -qO server.js https://raw.githubusercontent.com/ajifernandez/whatsapp-reminder/main/soporte-server/server.js && exec node server.js"
    ports:
      - "3100:3000"
    environment:
      DATA_DIR: /data
      ADMIN_USER: admin
      ADMIN_PASS: cambia-esto   # contraseña de la interfaz web (GET /); sin ella queda desactivada
      # NTFY_URL: https://ntfy.tudominio/diagnosticos   # opcional: aviso push
      # OFFLINE_MIN: 12   # minutos sin latidos para marcar una clínica como «Sin señal»
    volumes:
      - soporte-data:/data

volumes:
  soporte-data:
